<!DOCTYPE html>
<html>
<head>
<title>Medicine Reminder Box</title>
<style>
body { font-family: Arial; background: #eef2ff; padding: 20px; }
.box { background: white; max-width: 400px; margin: auto; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px gray; }
h2 { text-align: center; color: #333; }
label { display: block; margin-top: 12px; font-weight: bold; }
input, select { width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; }
button { width: 100%; margin-top: 20px; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; }
#msg { margin-top: 15px; text-align: center; color: green; font-weight: bold; }
</style>
</head>
<body>
<div class="box">
<h2>Medicine Reminder Box</h2>

<label>Your Name</label>
<input type="text" id="name" placeholder="Enter your name">

<label>Your Age</label>
<input type="number" id="age" placeholder="Enter your age">

<label>Tablet Name</label>
<input type="text" id="tablet" placeholder="Ex: Dolo 650">

<label>Time to take tablet</label>
<input type="time" id="time">

<label>Before Food or After Food</label>
<select id="food">
<option>Before Food</option>
<option>After Food</option>
</select>

<label>How many tablets?</label>
<select id="dose">
<option>One Tablet</option>
<option>Two Tablets</option>
</select>

<label>How often?</label>
<select id="often">
<option>Everyday</option>
<option>Once in a Week</option>
<option>Only One Day</option>
</select>

<button onclick="saveData()">Save Reminder</button>
<p id="msg"></p>
</div>

<script>
function saveData(){
let name = document.getElementById("name").value;
let tablet = document.getElementById("tablet").value;
let time = document.getElementById("time").value;
if(name=="" || tablet=="" || time==""){
document.getElementById("msg").innerHTML = "Please fill all details";
return;
}
document.getElementById("msg").innerHTML = "Reminder Saved! We will remind you via Alarm, SMS and WhatsApp at " + time;
alert("Reminder Saved for " + name + " - " + tablet + " at " + time);
}
</script>
</body>
</html>
